name: CI

on:
  push:
    branches:
      - main
      - master
      - copilot/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux PC/SC dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkgconf libpcsclite-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test
